name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and first, because the failure it catches is the one CI cannot otherwise
  # see: an unrecognised key makes GitHub discard a workflow file outright, so the
  # workflow just stops running and no check ever goes red. jobs-scrape.yml managed
  # that undetected for four days while its schedule silently did nothing.
  workflows:
    name: Workflow definitions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check workflow files load
        run: npm run check:workflows

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Run unit tests
        run: npm test
        working-directory: backend

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      # Before the lint, and deliberately not as a lint rule: oxlint 1.71.0 registers
      # `no-use-before-define` but does not implement it, so enabling the rule is a no-op.
      # The bug it targets is a temporal-dead-zone crash that renders a page blank on every
      # visit, and the hook order is legal, so `rules-of-hooks` cannot see it either. This
      # script has no dependencies, so it runs without an install step.
      - name: Check hook dependency order
        run: npm run check:hook-deps
      # Cache-first on hashed assets is the bug that kept a fixed crash live in
      # production: a client that lost connectivity booted an entire older
      # build from the cache and never revalidated it. No dependencies.
      - name: Check service worker asset policy
        run: npm run check:sw-assets
      - name: Check index.html for render blocking
        run: npm run check:render-blocking
      - name: Check translation files for duplicate keys
        run: npm run check:i18n-keys
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/cvboost_test
      PORT: 5001
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Never let the test server start its own scrape scheduler — the
      # jobs-scrape workflow is the single source of scheduled scrape triggers.
      JOB_SCRAPING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # Runs unconditionally, and before the suite: a reporter that silently stops
      # reporting is how this suite stayed red for weeks unnoticed.
      - name: Verify the e2e failure reporters
        run: |
          node scripts/e2e-failures.check.js
          node scripts/e2e-explain.check.js
      - name: Run e2e tests
        # The JSON reporter is added alongside the list reporter, not instead of it:
        # the log stays readable and the machine-readable report below drives the
        # annotations, so a failing test is legible from the check itself.
        #
        # tee would otherwise swallow the exit status, so pipefail restores it. That
        # matters here specifically: this step once failed in five seconds with no test
        # failures in the report at all, and a green step here would have hidden it.
        id: e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: |
          set -o pipefail
          npx playwright test --reporter=list,json 2>&1 | tee e2e-run.log
      - name: Surface e2e failures
        # Always, not only on failure: on a green run this reports the tally, so a
        # reporter that has stopped working is visible rather than silent. Always exits
        # 0, so it cannot mask the verdict from the step above.
        if: always()
        run: node scripts/e2e-failures.js e2e-results.json
      # The JSON report only exists once Playwright has collected and run tests, so a
      # failure before that -- a config error, a port already bound, a webServer process
      # that exited -- leaves the reporter with nothing to say. This step covers that
      # window, from the captured log, so the cause is an annotation on the check run
      # rather than something only visible to someone who can read the run log.
      - name: Explain the e2e step failure
        # failure() rather than steps.e2e.outcome: on the run that motivated this step,
        # the outcome comparison silently evaluated false and the explanation was skipped
        # -- the exact case this step exists for. failure() does not depend on the step
        # id resolving, and is still true here because the failure above persists.
        if: failure()
        run: node scripts/e2e-explain.js e2e-run.log
      # Both files are kept so the cause of a red job can be read from the run page
      # instead of reconstructed from annotations. A red run used to produce no
      # artifacts at all, which is why the log had to be recovered some other way.
      - name: Keep the e2e report and run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e-results.json
            e2e-run.log
          if-no-files-found: warn
          retention-days: 7

  deploy-readiness:
    name: Deployment config checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A container on Docker's default bridge cannot reach the runner's
    # loopback, so the image is smoke-tested with --network host, which makes
    # 127.0.0.1:27017 (the Mongo service) and 127.0.0.1:5000 (the app) both
    # resolve on the runner.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Syntax-check backend entrypoint
        run: node --check backend/server.js
      - name: Verify production dependency install
        run: npm ci --omit=dev
        working-directory: backend
      - name: Validate docker compose file
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --tag cvboost:ci .
      - name: Smoke-test container health endpoint
        run: |
          docker run --detach --name cvboost-ci --network host \
            --env MONGODB_URI="mongodb://127.0.0.1:27017/cvboost_ci" \
            --env NODE_ENV=production \
            --env JWT_SECRET=ci-secret \
            --env JWT_REFRESH_SECRET=ci-refresh-secret \
            --env JOB_SCRAPING_ENABLED=false \
            cvboost:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health; then
              echo "health endpoint responded"
              exit 0
            fi
            sleep 2
          done
          echo "::error::health endpoint never became ready"
          docker logs cvboost-ci
          exit 1
      - name: Clean up container
        if: always()
        run: docker rm --force cvboost-ci 2>/dev/null || true
