services:
  - type: web
    name: cvboost
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    # Matches the SIGTERM handler in backend/server.js, which drains in-flight
    # requests before exiting. Must be >= the app's own 10s force-exit timer.
    maxShutdownDelaySeconds: 15
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      # Optional. Backs the response cache, rate-limit counters and job-scrape
      # lock. Unset leaves all three in per-process memory, which resets on every
      # restart. Upstash: use the rediss:// URL so TLS is negotiated.
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: POSTHOG_PROJECT_TOKEN
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
      - key: SENTRY_DSN
        sync: false
      - key: BETTERSTACK_SOURCE_TOKEN
        sync: false
      - key: VITE_APP_ENV
        value: production
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_POSTHOG_KEY
        sync: false
      - key: VITE_POSTHOG_HOST
        sync: false
      # CORS_ORIGIN and FRONTEND_URL are deliberately NOT set here. The app
      # derives its own public origin from RENDER_EXTERNAL_URL, which Render
      # injects into every service (see backend/config/urls.js); an explicit
      # value here would win over it.
      #
      # The previous version used `fromService: {envVarKey: RENDER_EXTERNAL_URL}`
      # pointing at this same service. That is a self-reference, so it only
      # works if Render supports it during provisioning -- and it never applied
      # at all when the service was created by hand. Deriving the origin in code
      # is correct regardless of how the service was created.
      - key: CAMPAY_API_URL
        value: https://api.campay.net/api
      - key: CAMPAY_SANDBOX_USERNAME
        sync: false
      - key: CAMPAY_SANDBOX_PASSWORD
        sync: false
      - key: CAMPAY_USERNAME
        sync: false
      - key: CAMPAY_PASSWORD
        sync: false
      - key: CAMPAY_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Read by the backend and served to the browser at runtime via
      # GET /api/config. The VITE_ copy below is a local-dev fallback only:
      # Vite inlines VITE_* at build time, and on Render's Docker runtime the
      # frontend build runs inside `docker build`, where env vars are absent.
      # So the build-time copy is always empty in production and the Google
      # button only renders because of the runtime endpoint.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      # Render blocks outbound SMTP (25/465/587) on free instances, so the
      # nodemailer path below can only ever time out there. BREVO_API_KEY sends
      # over HTTPS on 443 instead and is preferred whenever it is set.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Must be an address verified as a sender in Brevo, or sends are rejected.
      - key: SMTP_FROM
        sync: false
      - key: CMO_ENDPOINT
        sync: false
      - key: CMO_REVENUE_KEY
        sync: false
      - key: JOB_SCRAPING_ENABLED
        value: "true"
      - key: JOB_SCRAPE_INTERVAL_MINUTES
        value: "360"
      - key: JOB_ENRICH_DETAILS
        value: "true"
      - key: JOB_ENRICH_MAX
        value: "12"
      # Days a listing stays on the board after a scrape last saw it. Soft flag
      # only (active:false); a relisted job reactivates itself. 0 disables.
      - key: JOB_EXPIRY_DAYS
        value: "30"
      - key: JOB_SCRAPE_KEY
        sync: false
      # Unverified accounts are held at /verify-email. Set this to "false" during
      # a mail-provider outage to let signups through, then remove it. Only the
      # literal "false" disables the gate.
      - key: REQUIRE_EMAIL_VERIFICATION
        sync: false
      # Web push. Both keys must be set together or push stays disabled.
      # Never rotate these casually: doing so invalidates every existing
      # browser subscription, silently and with no error.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
