services:
  - type: web
    name: cvboost
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    healthCheckTimeout: 100
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: POSTHOG_PROJECT_TOKEN
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
      - key: SENTRY_DSN
        sync: false
      - key: BETTERSTACK_SOURCE_TOKEN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_POSTHOG_KEY
        sync: false
      - key: VITE_POSTHOG_HOST
        sync: false
      - key: CORS_ORIGIN
        fromService:
          name: cvboost
          type: web
          property: url
      - key: FRONTEND_URL
        fromService:
          name: cvboost
          type: web
          property: url
      - key: CAMPAY_API_URL
        value: https://api.campay.net/api
      - key: CAMPAY_SANDBOX_USERNAME
        sync: false
      - key: CAMPAY_SANDBOX_PASSWORD
        sync: false
      - key: CAMPAY_USERNAME
        sync: false
      - key: CAMPAY_PASSWORD
        sync: false
      - key: CAMPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: JOB_SCRAPING_ENABLED
        value: "true"
      - key: JOB_SCRAPE_INTERVAL_MINUTES
        value: "360"
      - key: JOB_ENRICH_DETAILS
        value: "true"
      - key: JOB_SCRAPE_KEY
        sync: false
